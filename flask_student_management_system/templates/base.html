<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Manager{% endblock %}</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0}header{background:#15284b;color:#fff;padding:20px 5%}
    header a{color:#fff;text-decoration:none;font-weight:bold;font-size:20px}
    main{max-width:1000px;margin:34px auto;padding:0 18px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}
    .btn{display:inline-block;border:0;border-radius:9px;padding:10px 15px;background:#2457d6;color:white;text-decoration:none;cursor:pointer;font:inherit}
    .secondary{background:#e8edf6;color:#1e293b}.danger{background:#c73545}
    .panel{background:#fff;border:1px solid #e3e9f2;border-radius:14px;padding:20px;margin-top:22px;box-shadow:0 8px 24px #1c31500a}
    input{width:100%;padding:11px 12px;border:1px solid #ccd5e2;border-radius:8px;font:inherit;margin:6px 0 15px}
    label{font-weight:600}.search{display:flex;gap:8px;flex:1;max-width:460px}.search input{margin:0}
    table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;border-bottom:1px solid #edf0f5;text-align:left}
    th{color:#64748b;font-size:12px;text-transform:uppercase}.actions{white-space:nowrap}
    .flash{padding:12px 14px;border-radius:8px;margin:12px 0}.success{background:#e2f8e9;color:#176534}.error{background:#ffebed;color:#a61d2d}
    @media(max-width:640px){table{font-size:13px}th,td{padding:10px 5px}.actions{white-space:normal}}
  </style>
</head>
<body>
<header><a href="{{ url_for('index') }}">Student Manager</a></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
